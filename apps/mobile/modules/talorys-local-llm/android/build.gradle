// Talorys local models (docs/local-models.md): on-device LLMs with Google's LiteRT-LM runtime, the
// model downloader, and the phone's end of the agent's device bridge. Expo local module.
apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'dev.talorys'
version = '0.5.2'

android {
  namespace "com.talorys.localllm"
  defaultConfig {
    versionCode 13
    versionName '0.5.2'
    consumerProguardFiles 'proguard-rules.pro'
    // LiteRT-LM ships arm64-v8a only (the app builds arm64-v8a only, see gradle.properties).
    ndk { abiFilters 'arm64-v8a' }
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
  lint {
    disable 'MissingTranslation'
  }
}

dependencies {
  // LiteRT-LM Kotlin API (Google Maven). 0.19.0 is the first Android build whose GPU engine runs the
  // current Spark-X2.5 files (external weights; 0.18.x crashes, LiteRT-LM#3986). Its classes carry
  // Kotlin 2.4 metadata, so the app compiles with Kotlin 2.3.x (app.json → expo-build-properties).
  implementation 'com.google.ai.edge.litertlm:litertlm-android:0.19.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  implementation 'androidx.security:security-crypto:1.1.0'
  implementation 'androidx.core:core-ktx:1.17.0'
  implementation 'androidx.annotation:annotation:1.9.1'

  testImplementation 'junit:junit:4.13.2'
}
