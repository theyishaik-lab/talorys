<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Talorys — offline</title>
    <style>
      :root { color-scheme: light dark; --fg: #0e0e12; --muted: #71717c; --bg: #fff; --accent: #4c47e0; }
      @media (prefers-color-scheme: dark) { :root { --fg: #f2f2f4; --muted: #8e8e99; --bg: #0b0b0e; --accent: #8f8cff; } }
      html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: Inter, Heebo, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; box-sizing: border-box; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 20px; margin: 8px 0 0; font-weight: 600; }
      p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; max-width: 28rem; }
      button { margin-top: 12px; border: 0; border-radius: 10px; padding: 10px 18px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Talorys needs a connection to reach your agent. Your chats and approvals will be here the moment you're back online.</p>
      <p dir="rtl" lang="he">אין חיבור לאינטרנט. השיחות והאישורים יחכו כאן עד שהחיבור יחזור.</p>
      <form><button type="submit">Try again · נסה שוב</button></form>
    </main>
  </body>
</html>
